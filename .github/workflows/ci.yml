name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet fantomas --check .

  build:
    needs: format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore FSharp.Windows.Dsl.slnx

      - name: Build
        run: dotnet build FSharp.Windows.Dsl.slnx --no-restore

      # --minimum-expected-tests is the gate on the gate: `dotnet test` reported
      # success while running nothing at all until the global.json runner switch,
      # and a floor makes that failure loud instead of green.
      - name: Test
        run: dotnet test --solution FSharp.Windows.Dsl.slnx --no-build --minimum-expected-tests 323
